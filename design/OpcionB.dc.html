<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap');
    body { margin: 0; font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; }
    a { color: #22d3ee; } a:hover { color: #67e8f9; }
  </style>
</helmet>

<div style="width: 1080px; height: 1080px; position: relative; background: #0b1220; overflow: hidden; display: flex; align-items: center; justify-content: center;">

  <svg width="1080" height="1080" viewBox="0 0 1080 1080" style="position: absolute; inset: 0;" aria-hidden="true">
    <defs>
      <radialGradient id="glowB" cx="50%" cy="50%" r="48%">
        <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20" />
        <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#0b1220" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="1080" height="1080" fill="url(#glowB)" />
  </svg>

  <!-- Hexágono contenedor + rayo: energía, que es lo que vende la tienda -->
  <svg width="700" height="700" viewBox="0 0 200 200" style="position: relative; z-index: 2;" role="img" aria-label="Isotipo Sevelin rayo">
    <g style="filter: drop-shadow(0 0 22px rgba(34, 211, 238, 0.38));">
      <path d="M100 16 L173 58 L173 142 L100 184 L27 142 L27 58 Z"
            fill="none" stroke="#22d3ee" stroke-width="9" stroke-linejoin="miter" opacity="0.55" />
      <path d="M100 34 L157 67 L157 133 L100 166 L43 133 L43 67 Z"
            fill="#0e1a2b" stroke="#164e63" stroke-width="2" />
      <path d="M112 54 L74 106 L96 106 L88 148 L128 92 L105 92 Z" fill="#22d3ee" />
    </g>
    <circle cx="100" cy="16" r="8" fill="#e879f9" />
  </svg>

</div>
</x-dc>
</body>
</html>
